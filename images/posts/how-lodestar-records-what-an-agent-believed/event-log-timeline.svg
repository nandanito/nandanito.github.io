  <title id="t">One session, eight events on the append-only log</title>
  <desc id="d">A horizontal timeline showing eight events (seq 47 through 54) appended to an NDJSON event log during a single agent session. Events 1 through 5 (observations, claims, evidence_set) render in slate as a baseline pipeline. Between event 5 (evd-9001 evidence_set) and event 6 (blf-44a2 belief_proposed), a vertical dashed red marker labels the moment the auto-observation gate fires and the belief&#39;s authority is downgraded from auto_observation to reflection. Event 6 renders in red as the downgraded belief. Events 7 (decision) and 8 (action) render in slate — they reference the flagged belief but cannot promote it.</desc>

  
  <text x="24" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.16em" fill="#777777">EVENT LOG · session sess-9c81 · ndjson · append-only</text>

  
