<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif">
  <title id="title">Why &#34;matched parameters&#34; isn&#39;t matched: three resource axes for a fair QML comparison</title>
  <desc id="desc">Three small parallel bar charts compare a naive classical baseline, a quantum (PQC) method, and a training-cost-matched classical baseline along three resource axes. On Axis 1 (trainable parameters) the naive classical and the quantum method are identical at 200 while the true matched classical baseline is roughly 1000 times larger at 200,000. On Axis 2 (quantum shots per inference) only the quantum method incurs a cost, at 10,000 shots, while both classical baselines are zero. On Axis 3 (total training cost) the naive classical baseline is 1x while the quantum method and the matched classical baseline both sit at roughly 10x. The takeaway is that matching on one axis does not constitute a matched comparison: the fair classical baseline is the model with the same total training cost as the quantum method.</desc>

  <rect width="900" height="540" fill="#ffffff"></rect>

  
  <text x="60" y="44" font-size="18" font-weight="600" fill="#1f2937">Why “matched parameters” isn’t matched</text>
  <text x="60" y="66" font-size="12" fill="#6b7280">Three resource axes for a fair QML comparison</text>

  
  <line x1="60" y1="86" x2="840" y2="86" stroke="#cbd5e1" stroke-width="1"></line>

  
  
  
  
  <g>
    <text x="60" y="112" font-size="10" letter-spacing="1.6" fill="#6b7280">AXIS 1 — TRAINABLE PARAMETERS</text>
    <text x="60" y="132" font-size="12" fill="#475569">Model size (parameter count)</text>

    
    <line x1="60" y1="400" x2="280" y2="400" stroke="#94a3b8" stroke-width="1"></line>
    
    <line x1="60" y1="160" x2="64" y2="160" stroke="#cbd5e1" stroke-width="1"></line>
    <text x="60" y="155" font-size="10" fill="#94a3b8">200,000</text>

    
    
    <rect x="101" y="397" width="30" height="3" fill="#94a3b8"></rect>
    <text x="116" y="389" text-anchor="middle" font-size="11" fill="#475569">200</text>

    
    <rect x="155" y="397" width="30" height="3" fill="#475569"></rect>
    <text x="170" y="389" text-anchor="middle" font-size="11" fill="#475569">200</text>

    
    <rect x="209" y="160" width="30" height="240" fill="#0369a1"></rect>
    <text x="224" y="152" text-anchor="middle" font-size="11" font-weight="600" fill="#0369a1">200,000</text>

    
    <g font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="116" y="418">N</text>
      <text x="170" y="418">Q</text>
      <text x="224" y="418">M</text>
    </g>
  </g>

  
  
  
  
  <g>
    <text x="330" y="112" font-size="10" letter-spacing="1.6" fill="#6b7280">AXIS 2 — QUANTUM SHOTS / INFERENCE</text>
    <text x="330" y="132" font-size="12" fill="#475569">Per-prediction quantum measurements</text>

    <line x1="330" y1="400" x2="550" y2="400" stroke="#94a3b8" stroke-width="1"></line>
    <line x1="330" y1="160" x2="334" y2="160" stroke="#cbd5e1" stroke-width="1"></line>
    <text x="330" y="155" font-size="10" fill="#94a3b8">10,000</text>

    
    <line x1="371" y1="400" x2="401" y2="400" stroke="#94a3b8" stroke-width="2"></line>
    <text x="386" y="389" text-anchor="middle" font-size="11" fill="#475569">0</text>

    
    <rect x="425" y="160" width="30" height="240" fill="#475569"></rect>
    <text x="440" y="152" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">10,000</text>

    
    <line x1="479" y1="400" x2="509" y2="400" stroke="#94a3b8" stroke-width="2"></line>
    <text x="494" y="389" text-anchor="middle" font-size="11" fill="#0369a1">0</text>

    <g font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="386" y="418">N</text>
      <text x="440" y="418">Q</text>
      <text x="494" y="418">M</text>
    </g>
  </g>

  
  
  
  
  <g>
    <text x="600" y="112" font-size="10" letter-spacing="1.6" fill="#6b7280">AXIS 3 — TOTAL TRAINING COST</text>
    <text x="600" y="132" font-size="12" fill="#475569">Relative compute (arbitrary units)</text>

    <line x1="600" y1="400" x2="820" y2="400" stroke="#94a3b8" stroke-width="1"></line>
    <line x1="600" y1="160" x2="604" y2="160" stroke="#cbd5e1" stroke-width="1"></line>
    <text x="600" y="155" font-size="10" fill="#94a3b8">10×</text>

    
    <rect x="641" y="376" width="30" height="24" fill="#94a3b8"></rect>
    <text x="656" y="368" text-anchor="middle" font-size="11" fill="#475569">1×</text>

    
    <rect x="695" y="160" width="30" height="240" fill="#475569"></rect>
    <text x="710" y="152" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">~10×</text>

    
    <rect x="749" y="160" width="30" height="240" fill="#0369a1"></rect>
    <text x="764" y="152" text-anchor="middle" font-size="11" font-weight="600" fill="#0369a1">~10×</text>

    <g font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="656" y="418">N</text>
      <text x="710" y="418">Q</text>
      <text x="764" y="418">M</text>
    </g>

    
  </g>

  
  
  
  <g>
    <line x1="60" y1="446" x2="840" y2="446" stroke="#e5e7eb" stroke-width="1"></line>

    
    <rect x="60" y="464" width="14" height="14" fill="#94a3b8"></rect>
    <text x="82" y="475" font-size="12" fill="#1f2937">N  Naive classical baseline</text>
    <text x="82" y="490" font-size="11" fill="#6b7280">200 params, 0 shots, 1× cost</text>

    
    <rect x="320" y="464" width="14" height="14" fill="#475569"></rect>
    <text x="342" y="475" font-size="12" fill="#1f2937">Q  Quantum method (PQC)</text>
    <text x="342" y="490" font-size="11" fill="#6b7280">200 params, 10,000 shots, ~10× cost</text>

    
    <rect x="580" y="464" width="14" height="14" fill="#0369a1"></rect>
    <text x="602" y="475" font-size="12" fill="#1f2937">M  Matched classical baseline</text>
    <text x="602" y="490" font-size="11" fill="#6b7280">~200,000 params, 0 shots, ~10× cost</text>
  </g>

  
  
  
  <g font-size="12" font-style="italic" fill="#475569">
    <text x="60" y="520">Two methods “matched” on one axis are not matched on the others.</text>
    <text x="60" y="534">The fair classical comparison is the model with the same total training cost as the quantum method.</text>
  </g>
</svg>