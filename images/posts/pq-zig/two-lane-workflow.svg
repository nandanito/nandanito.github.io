<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 650" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="tlTitle tlDesc" style="max-width:880px;height:auto;background:#ffffff" font-family="&#39;Source Sans Pro&#39;, ui-sans-serif, system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif">
<title id="tlTitle">The two lanes</title>
<desc id="tlDesc">Two-lane workflow diagram: a single specification, FIPS 205, branches into two paths of equal weight. Lane A covers the standalone library — src, tests, benchmarks, examples, CI and documentation — where AI assistance is permitted and every line is human-reviewed. Lane B covers the reserved upstream-candidate directory, which holds an independent from-scratch second reading of the same specification, is human-authored only, and has a commit-trailer check enforced in CI. There is no connection between the two lanes. Both descend to a single comparison at the bottom: where the two disagree, one of them is wrong.</desc>
<defs>
<marker id="tlArrowNeutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#555555"></path></marker>
<marker id="tlArrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#34374c"></path></marker>
<marker id="tlArrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#4a3f2a"></path></marker>
<marker id="tlArrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b58900"></path></marker>
</defs>
