<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" role="img" aria-labelledby="title desc">
  <title id="title">Post-quantum cryptography migration timeline 2024–2035</title>
  <desc id="desc">A combined timeline showing regulatory, corporate, and industry milestones for post-quantum cryptography migration between 2024 and 2035.</desc>

  <rect width="1060" height="480" fill="#ffffff"></rect>

  <text x="530" y="36" text-anchor="middle" font-family="Source Sans Pro, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="20" fill="#000000">Post-quantum cryptography migration — 2024 to 2035</text>
  <text x="530" y="58" text-anchor="middle" font-family="Source Sans Pro, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#555555">Regulatory, corporate, and industry milestones on a single timeline</text>

  <line x1="60" y1="270" x2="980" y2="270" stroke="#34374c" stroke-width="1.5"></line>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#777777" text-anchor="middle">
    <line x1="60" y1="266" x2="60" y2="274" stroke="#34374c" stroke-width="1"></line><text x="60" y="292" fill="#000000" font-weight="700">2024</text>
    <line x1="143" y1="266" x2="143" y2="274" stroke="#34374c" stroke-width="1"></line><text x="143" y="292">2025</text>
    <line x1="227" y1="266" x2="227" y2="274" stroke="#34374c" stroke-width="1"></line><text x="227" y="292" fill="#000000" font-weight="700">2026</text>
    <line x1="310" y1="266" x2="310" y2="274" stroke="#34374c" stroke-width="1"></line><text x="310" y="292">2027</text>
    <line x1="394" y1="266" x2="394" y2="274" stroke="#34374c" stroke-width="1"></line><text x="394" y="292">2028</text>
    <line x1="477" y1="266" x2="477" y2="274" stroke="#34374c" stroke-width="1"></line><text x="477" y="292" fill="#000000" font-weight="700">2029</text>
    <line x1="561" y1="266" x2="561" y2="274" stroke="#34374c" stroke-width="1"></line><text x="561" y="292">2030</text>
    <line x1="644" y1="266" x2="644" y2="274" stroke="#34374c" stroke-width="1"></line><text x="644" y="292" fill="#000000" font-weight="700">2031</text>
    <line x1="728" y1="266" x2="728" y2="274" stroke="#34374c" stroke-width="1"></line><text x="728" y="292">2032</text>
    <line x1="811" y1="266" x2="811" y2="274" stroke="#34374c" stroke-width="1"></line><text x="811" y="292">2033</text>
    <line x1="895" y1="266" x2="895" y2="274" stroke="#34374c" stroke-width="1"></line><text x="895" y="292">2034</text>
    <line x1="978" y1="266" x2="978" y2="274" stroke="#34374c" stroke-width="1"></line><text x="978" y="292" fill="#000000" font-weight="700">2035</text>
  </g>

  <g>
    <line x1="103" y1="270" x2="103" y2="240" stroke="#b8b8b8" stroke-width="1" stroke-dasharray="2 3"></line>
    <line x1="310" y1="270" x2="310" y2="240" stroke="#b8b8b8" stroke-width="1" stroke-dasharray="2 3"></line>
    <line x1="561" y1="270" x2="561" y2="240" stroke="#b8b8b8" stroke-width="1" stroke-dasharray="2 3"></line>
    <line x1="227" y1="270" x2="227" y2="305" stroke="#b8b8b8" stroke-width="1" stroke-dasharray="2 3"></line>
    <line x1="244" y1="270" x2="244" y2="385" stroke="#b8b8b8" stroke-width="1" stroke-dasharray="2 3"></line>
    <line x1="477" y1="270" x2="477" y2="305" stroke="#b8b8b8" stroke-width="1" stroke-dasharray="2 3"></line>
    <line x1="644" y1="270" x2="644" y2="385" stroke="#b8b8b8" stroke-width="1" stroke-dasharray="2 3"></line>
    <line x1="978" y1="270" x2="978" y2="305" stroke="#b8b8b8" stroke-width="1" stroke-dasharray="2 3"></line>
  </g>

  <line x1="244" y1="150" x2="244" y2="270" stroke="#b58900" stroke-width="1.5"></line>

  <g>
    <circle cx="103" cy="270" r="4" fill="#34374c"></circle>
    <circle cx="227" cy="270" r="4" fill="#34374c"></circle>
    <circle cx="244" cy="270" r="4.5" fill="#b58900"></circle>
    <circle cx="310" cy="270" r="4" fill="#34374c"></circle>
    <circle cx="477" cy="270" r="4" fill="#34374c"></circle>
    <circle cx="561" cy="270" r="4" fill="#34374c"></circle>
    <circle cx="644" cy="270" r="4" fill="#34374c"></circle>
    <circle cx="978" cy="270" r="4" fill="#34374c"></circle>
  </g>

  <g font-family="Source Sans Pro, -apple-system, BlinkMacSystemFont, sans-serif">

    <rect x="144" y="80" width="200" height="70" fill="#f4efe8" stroke="#b58900" stroke-width="1"></rect>
    <rect x="144" y="80" width="3" height="70" fill="#b58900"></rect>
    <text x="247" y="102" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6e5500" letter-spacing="0.08em" font-weight="700">INFLECTION · MARCH 2026</text>
    <text x="247" y="124" text-anchor="middle" font-size="12" fill="#000000">Google + Caltech papers</text>
    <text x="247" y="140" text-anchor="middle" font-size="12" fill="#000000">compress ECC qubit estimate</text>

    <rect x="23" y="170" width="160" height="70" fill="#fafafa" stroke="#e8e8e8" stroke-width="1"></rect>
    <text x="103" y="192" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#777777" letter-spacing="0.08em">REGULATORY · AUG 2024</text>
    <text x="103" y="214" text-anchor="middle" font-size="12" fill="#000000">NIST finalizes ML-KEM,</text>
    <text x="103" y="230" text-anchor="middle" font-size="12" fill="#000000">ML-DSA, SLH-DSA</text>

    <rect x="230" y="170" width="160" height="70" fill="#fafafa" stroke="#e8e8e8" stroke-width="1"></rect>
    <text x="310" y="192" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#777777" letter-spacing="0.08em">REGULATORY · JAN 2027</text>
    <text x="310" y="214" text-anchor="middle" font-size="12" fill="#000000">CNSA 2.0 required for</text>
    <text x="310" y="230" text-anchor="middle" font-size="12" fill="#000000">new NSS acquisitions</text>

    <rect x="471" y="170" width="180" height="70" fill="#fafafa" stroke="#e8e8e8" stroke-width="1"></rect>
    <text x="561" y="192" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#777777" letter-spacing="0.08em">REGULATORY · END 2030</text>
    <text x="561" y="214" text-anchor="middle" font-size="12" fill="#000000">Non-CNSA equipment</text>
    <text x="561" y="230" text-anchor="middle" font-size="12" fill="#000000">phased out</text>

    <rect x="147" y="305" width="160" height="70" fill="#fafafa" stroke="#e8e8e8" stroke-width="1"></rect>
    <text x="227" y="327" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#777777" letter-spacing="0.08em">INDUSTRY · JAN 2026</text>
    <text x="227" y="349" text-anchor="middle" font-size="12" fill="#000000">Ethereum PQ security</text>
    <text x="227" y="365" text-anchor="middle" font-size="12" fill="#000000">team formed</text>

    <rect x="377" y="305" width="200" height="70" fill="#fafafa" stroke="#e8e8e8" stroke-width="1"></rect>
    <text x="477" y="327" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#777777" letter-spacing="0.08em">CORPORATE · 2029</text>
    <text x="477" y="349" text-anchor="middle" font-size="12" fill="#000000">Google + Cloudflare target</text>
    <text x="477" y="365" text-anchor="middle" font-size="12" fill="#000000">full PQ incl. authentication</text>

    <rect x="898" y="305" width="160" height="70" fill="#fafafa" stroke="#e8e8e8" stroke-width="1"></rect>
    <text x="978" y="327" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#777777" letter-spacing="0.08em">REGULATORY · 2035</text>
    <text x="978" y="349" text-anchor="middle" font-size="12" fill="#000000">Full transition target</text>
    <text x="978" y="365" text-anchor="middle" font-size="12" fill="#000000">(NSM-10 / NIST)</text>

    <rect x="164" y="385" width="160" height="70" fill="#fafafa" stroke="#e8e8e8" stroke-width="1"></rect>
    <text x="244" y="407" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#777777" letter-spacing="0.08em">INDUSTRY · APR 2026</text>
    <text x="244" y="429" text-anchor="middle" font-size="12" fill="#000000">Tron announces mainnet</text>
    <text x="244" y="445" text-anchor="middle" font-size="12" fill="#000000">PQC deployment</text>

    <rect x="554" y="385" width="180" height="70" fill="#fafafa" stroke="#e8e8e8" stroke-width="1"></rect>
    <text x="644" y="407" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#777777" letter-spacing="0.08em">REGULATORY · END 2031</text>
    <text x="644" y="429" text-anchor="middle" font-size="12" fill="#000000">CNSA 2.0 mandatory</text>
    <text x="644" y="445" text-anchor="middle" font-size="12" fill="#000000">across NSS</text>

  </g>
</svg>