<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif">
  <title id="title">QMI Lab: three pillars of research</title>
  <desc id="desc">A horizontal three-column diagram showing the three research pillars of QMI Lab. Above the columns sits the lab&#39;s founding question about how information becomes knowledge and how to build machines that genuinely understand rather than merely predict. Each column describes one pillar with its time horizon, evidentiary standard, current project, and methods. Pillar I (Foundations of machine intelligence) is present-day, experimental, publish-now work, currently a cross-lingual transfer project on five languages using QLoRA on Llama 3.1 8B. Pillar II (Quantum machine intelligence) is near-term, benchmark-driven with matched-resource comparisons, currently hybrid quantum-classical Transformer fine-tuning for NLP using PennyLane and classical baselines. Pillar III (Quantum world models) is long-horizon, agenda-setting and conceptual, currently a position paper on quantum world models. A thin horizontal time axis runs beneath the columns marking now, near-term, and long. Below the axis an italic line notes that this is one program viewed from three time horizons: Pillar I&#39;s methodology feeds Pillar II&#39;s evaluation discipline, and Pillar II&#39;s results inform what is realistic in Pillar III.</desc>

  
  <rect width="900" height="680" fill="#ffffff"></rect>

  
  <text x="450" y="38" text-anchor="middle" font-size="11" letter-spacing="2.2" fill="#6b7280">A FOUNDING QUESTION</text>

  <g font-size="18" fill="#1f2937" text-anchor="middle">
    <text x="450" y="74">How does information become knowledge?</text>
    <text x="450" y="100">How do we build machines that genuinely understand rather than merely predict?</text>
  </g>

  
