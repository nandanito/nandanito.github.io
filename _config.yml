# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you: 
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Nandan Joshi
email: noreply@nandan.me
tagline: Physics → Software → Quantum
description: Physicist working across machine intelligence, quantum computing, and digital-asset infrastructure. Independent research at QMI Lab and AstroLLM.
baseurl: "" # the subpath of your site, e.g. /blog
url: https://nandan.me # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: nandanito
github_username:  nandanito

locale: en_US
logo: /images/nandan-logo.png
search: true
skin: "/assets/css/skins/purple.css"

# Build settings
# theme: minima
# remote_theme: mmistakes/minimal-mistakes@4.24.0
remote_theme: mmistakes/so-simple-theme
plugins:
  - jekyll-feed
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-paginate
  - jekyll-redirect-from

# Jekyll configuration

permalink:   /:categories/:title/
markdown:    kramdown
highlighter: rouge
sass:
  sass_dir: _sass
  style: compressed

kramdown:
  input: GFM
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  enable_coderay: false

mathjax:
  enable: true
  tags: "ams"

read_time: true
words_per_minute: 200

paginate: 5  # amount of posts to show per page
paginate_path: /page:num/

category_archive_path: "/categories/#"
tag_archive_path: "/tags/#"

author: nandan

# Archive collection: 2012–2013 posts moved here so they are excluded
# from the main feed and the homepage chronology, while still resolving
# at /archive/<slug>/ via the redirects in each item's front matter.
collections:
  archive:
    output: true
    permalink: /archive/:name/

defaults:
  - scope:
      path: ""
      type: archive
    values:
      layout: archived
      sitemap: false
      noindex: true

footer_links:
    - title: X
      url: https://x.com/nandanito
      icon: fa-brands fa-x-twitter
    - title: LinkedIn
      url: https://linkedin.com/in/NandanJoshi
      icon: fa-brands fa-linkedin-in
    - title: GitHub
      url: https://github.com/nandanito
      icon: fa-brands fa-github
    - title: Hugging Face
      url: https://huggingface.co/cybernandan
      icon: fa-brands fa-hugging-face

google_fonts:
  - name: "Source Sans Pro"
    weights: "400,400i,700,700i"
  - name: "Lora"
    weights: "400,400i,700,700i"

# Exclude from processing.
exclude:
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  - .ruby-version
  - .gitignore
